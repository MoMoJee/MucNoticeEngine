[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muc-notice-engine"
version = "0.1.0"
description = "中央民族大学多站点通知聚合 / 存储 / 去重引擎（独立服务，非 AstrBot 插件）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "gmssl>=3.2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
render = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
muc-notice-engine = "muc_notice_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/muc_notice_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# reference/ 是上游只读参考副本，不纳入本项目的 lint。
exclude = ["reference", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
