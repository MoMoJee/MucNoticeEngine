# MucNoticeEngine 配置示例。
# 复制为 config.toml 后按需修改；config.toml 已在 .gitignore 中，不会入库。
# 环境变量优先级高于本文件（见 src/muc_notice_engine/config.py 的 _ENV_MAP）。

# --- 路径 / 存储 ---
data_dir = "data"
# db_path = "data/muc_notice.db"   # 不填则跟随 data_dir
rss_file = "muc_notice_rss.xml"

# --- 抓取 ---
poll_interval_minutes = 240
poll_on_start = true
request_timeout_seconds = 20
max_concurrent_requests = 5
rss_max_items = 150
# 门户每个 type 每轮抓取的最大页数（每页 20 条）
portal_page_limit = 3
rss_title = "中央民族大学多站点通知聚合"

# --- 推送 / 保留 ---
push_max_age_days = 30
# 数据库记录保留期：按入库时间（first_seen_at）清理；0（默认）不清理。
# 归档文件的大小上限见 archive_total_limit_gb。
notice_retention_days = 0

# --- 正文 / 附件归档 ---
archive_enable = true
# archive_dir = "data/archive"   # 不填则跟随 data_dir
archive_workers = 2
archive_enqueue_limit_per_poll = 50
archive_max_file_mb = 50
archive_max_per_notice = 50
# 自动归档时间窗：published_at >= max(floor_date, now - window_days)
archive_window_days = 90
archive_floor_date = "2026-08-31"
# 归档目录总上限（GB），超限按最近访问时间升序淘汰
archive_total_limit_gb = 64
# 首轮回填 / 手动回填是否也推送 webhook
backfill_push = false

# --- 信息门户认证（可选；不填则只抓公开站点）---
muc_username = ""
muc_password = ""

# --- REST API ---
api_host = "127.0.0.1"
api_port = 8080
# 非空时 /api/* 需要 Authorization: Bearer <token>；/health 始终公开
api_token = ""

# --- Webhook ---
webhook_timeout_seconds = 10
